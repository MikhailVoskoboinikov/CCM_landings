<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Макет лендингов ЦКМ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Оболочка макета (панели, комментарии) ===== */
:root{
  --t-bg:#E9ECF1; --t-panel:#FFFFFF; --t-ink:#1B1E26; --t-muted:#6A7080; --t-line:#DADFE7;
  --t-dark:#1C2030; --t-dark-2:#2A3044; --t-accent:#3B5BDB; --t-q:#FFE58A; --t-q-ink:#5A4300;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--t-bg);color:var(--t-ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:var(--topbar-h,58px)}
button,input,select,textarea{font:inherit;color:inherit}
.T-top{position:fixed;inset:0 0 auto 0;z-index:50;background:var(--t-dark);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px}
.T-brand{font-weight:700;white-space:nowrap;margin-right:4px}
.T-brand small{display:block;font-weight:400;color:#9AA3B8;font-size:11px}
.T-field{display:flex;align-items:center;gap:6px;font-size:12px;color:#AEB6C8}
.T-field select{background:var(--t-dark-2);border:1px solid #3A4260;border-radius:8px;color:#fff;padding:6px 8px;max-width:230px}
.T-seg{display:inline-flex;background:var(--t-dark-2);border-radius:9px;padding:3px}
.T-seg button{border:0;background:none;color:#AEB6C8;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:12px}
.T-seg button.on{background:#fff;color:var(--t-dark)}
.T-btn{border:0;background:var(--t-dark-2);color:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.T-btn:hover{background:#353C55}
.T-btn .n{background:var(--t-q);color:var(--t-q-ink);border-radius:10px;padding:0 6px;font-weight:700;font-size:11px}
.T-btn .n.c{background:#fff;color:var(--t-dark)}
.T-spacer{flex:1}
.T-chk{display:flex;gap:6px;align-items:center;font-size:12px;color:#AEB6C8;cursor:pointer;user-select:none}

.T-main{padding:20px 16px 80px;transition:padding-right .2s}
body.drawer-open .T-main{padding-right:396px}
.stage{margin:0 auto;background:#fff;container-type:inline-size;container-name:L;overflow:clip;max-width:1440px;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(20,30,60,.08)}
body.dev-mobile .stage{max-width:390px;border-radius:30px;box-shadow:0 0 0 10px #1C2030,0 20px 50px rgba(0,0,0,.25);margin-top:10px}

.T-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:#F4F6FA;color:var(--t-ink);padding:8px 14px;font-size:12px;border-block:1px solid var(--t-line)}
body.no-bars .T-bar{display:none}
.T-bar b{font-weight:700;margin-right:2px}
.T-bar .grp{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.T-bar .grp span{color:var(--t-muted)}
.T-pill{border:1px solid var(--t-line);background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}
.T-pill.on{background:var(--t-dark);color:#fff;border-color:var(--t-dark)}
.T-note{color:var(--t-muted);font-size:11.5px}
.T-cbtn{margin-left:auto;background:#fff;border:1px solid var(--t-line);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font-size:12px}
.T-cbtn.has{background:var(--t-accent);color:#fff;border-color:var(--t-accent)}
.T-cbtn svg{width:14px;height:14px}
.T-libhead{padding:26px 20px 6px;font-size:20px;font-weight:800;color:var(--t-ink);font-family:system-ui,sans-serif}
.T-libhead small{display:block;font-size:13px;font-weight:400;color:var(--t-muted)}

.T-drawer{position:fixed;top:var(--topbar-h,58px);right:0;bottom:0;width:380px;max-width:100%;background:var(--t-panel);z-index:40;box-shadow:-10px 0 30px rgba(20,30,60,.12);display:none;flex-direction:column}
body.drawer-open .T-drawer{display:flex}
.T-dtabs{display:flex;gap:4px;padding:12px 12px 0}
.T-dtabs button{flex:1;border:0;background:#F1F3F7;border-radius:9px;padding:8px;cursor:pointer;font-weight:600}
.T-dtabs button.on{background:var(--t-dark);color:#fff}
.T-dbody{flex:1;overflow:auto;padding:14px}
.T-dfoot{padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;background:#F7F8FB}
.T-dfoot button{border:1px solid var(--t-line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
.T-ctx{background:#F1F3F7;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.T-ctx .x{float:right;border:0;background:none;cursor:pointer;color:var(--t-muted)}
.T-in{width:100%;border:1px solid var(--t-line);border-radius:9px;padding:8px 10px;background:#fff}
textarea.T-in{min-height:84px;resize:vertical}
.T-add{margin-top:8px;border:0;background:var(--t-accent);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.T-cm{background:#fff;border:1px solid var(--t-line);border-radius:12px;padding:10px 12px;margin-top:10px}
.T-cm .meta{font-size:11.5px;color:var(--t-muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.T-cm .meta .tag{background:#EEF1FB;color:#33427A;border-radius:6px;padding:1px 6px}
.T-cm .txt{margin-top:4px;white-space:pre-wrap}
.T-cm .del{margin-left:auto;border:0;background:none;color:var(--t-muted);cursor:pointer;font-size:11.5px}
.T-empty{color:var(--t-muted);text-align:center;padding:30px 10px}
.T-qlist{margin:0;padding:0;list-style:none;counter-reset:q}
.T-qlist li{counter-increment:q;background:#FFFBEA;border-radius:10px;padding:9px 12px 9px 38px;margin-bottom:8px;position:relative}
.T-qlist li::before{content:counter(q);position:absolute;left:11px;top:9px;font-weight:700;color:var(--t-q-ink)}
.T-qlist li small{display:block;color:var(--t-muted);margin-top:3px}
.T-help{font-size:12.5px;color:var(--t-muted);margin:0 0 12px}
.T-tip{position:fixed;z-index:100;max-width:280px;background:#1C2030;color:#fff;font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:9px;pointer-events:none;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.T-tip b{color:var(--t-q)}
.T-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1C2030;color:#fff;padding:9px 16px;border-radius:10px;z-index:120;display:none}
@media (max-width:820px){
  body.drawer-open .T-main{padding-right:16px}
  .T-drawer{width:100%}
  .T-field select{max-width:160px}
}

/* ===== Лендинг: стиль globalccm.com — белый, воздух, красный акцент ===== */
.L{
  --red:#DA2A2F; --red-600:#B91F24; --red-50:#FCEEEE; --yellow:#F5B800;
  --ink:#111317; --ink-2:#4A4F57; --muted:#8B9099; --line:#E2E5E9; --soft:#F1F3F6; --foot:#F4F4F4;
  color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;background:#fff;
}
.L *{box-sizing:border-box}
.L h1,.L h2,.L h3,.L h4{margin:0;line-height:1.2}
.L p{margin:0}
.L a{color:inherit;text-decoration:none}
.L .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.L .wrap.wide{max-width:1200px}
.L .sec{padding:64px 0}
.L .sec.soft{background:var(--soft)}
.L .sec.tight{padding:36px 0}
.L .h2{font-size:clamp(26px,3.6cqi,42px);font-weight:700;letter-spacing:-.005em}
.L .h2.red{color:var(--red)}
.L .sub-light{font-size:clamp(17px,2cqi,21px);font-weight:300;color:var(--ink-2);margin-top:14px}
.L .sub-bold{font-size:clamp(16px,1.8cqi,19px);font-weight:700;margin-top:12px}
.L .head{margin-bottom:36px}
.L .head.c{text-align:center}
.L .head.c .sub-light{max-width:620px;margin-left:auto;margin-right:auto}
.L .ic{width:22px;height:22px;flex:none}
.L .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 34px;border-radius:999px;font-weight:600;font-size:15px;border:0;cursor:pointer;white-space:nowrap;transition:background .15s}
.L .btn-red{background:var(--red);color:#fff}
.L .btn-red:hover{background:var(--red-600)}
.L .btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #BFC4CB}
.L .btn-line:hover{background:var(--soft)}
.L .on-photo .btn-line{color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.85)}
.L .on-photo .btn-line:hover{background:rgba(255,255,255,.12)}
.L .btn-grey{background:#E4E6E9;color:var(--ink)}
.L .btn .ic{width:19px;height:19px}
.L .btns{display:flex;flex-wrap:wrap;gap:14px}
.L .ph{position:relative;background:#DDE1E6;overflow:hidden}
.L .ph::before{content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;font-size:13px;color:#6A7282}
.L .ph img{position:relative;display:block;width:100%;height:100%;object-fit:cover}
.L .q{background:var(--t-q,#FFE58A);color:#3A2800;border-radius:3px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:help}
.L .q.empty{padding:0 6px;font-weight:700}
body.no-marks .L .q{background:none;padding:0;color:inherit}
body.no-marks .L .q.empty{display:none}
.L .draft{display:inline-block;background:#FFF5D6;color:#7A5200;border-radius:6px;padding:5px 12px;font-size:13px;margin-bottom:20px;font-family:system-ui,sans-serif}
body.no-marks .L .draft{display:none}
.L .grid{display:grid;gap:28px}
.L .shadow-card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 2px 24px rgba(17,19,23,.07)}
@container L (min-width:760px){
  .L .wrap{padding:0 32px}
  .L .sec{padding:100px 0}
  .L .sec.tight{padding:48px 0}
  .L .head{margin-bottom:56px}
  .L .g2{grid-template-columns:repeat(2,1fr)}
  .L .g3{grid-template-columns:repeat(3,1fr)}
  .L .g4{grid-template-columns:repeat(4,1fr)}
}
@container L (min-width:560px) and (max-width:759px){ .L .g3,.L .g4{grid-template-columns:repeat(2,1fr)} }

/* Шапка */
.L .hdr{display:flex;align-items:center;gap:28px;min-height:70px}
.L .logo{display:flex;align-items:center;gap:12px;flex:none}
.L .logo img{height:40px;width:auto}
.L .logo span{font-size:12px;line-height:1.25;color:var(--muted);max-width:110px}
.L .nav{display:none;gap:26px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.L .nav a:hover{color:var(--red)}
.L .hdr-r{margin-left:auto;display:flex;align-items:center;gap:18px}
.L .hdr-phone{display:none;font-weight:600;font-size:15px;white-space:nowrap}
.L .langs{display:none;gap:12px;font-size:13px;font-weight:600}
.L .langs a:first-child{color:var(--red)}
.L .hdr .btn{min-height:42px;padding:0 22px;font-size:13.5px}
.L .msgr{display:flex;gap:8px}
.L .msgr a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#111317;color:#fff}
.L .msgr .ic{width:17px;height:17px}
@container L (min-width:1000px){ .L .nav{display:flex} .L .langs{display:flex} }
@container L (min-width:1240px){ .L .hdr-phone{display:block} }
@container L (max-width:520px){ .L .hdr .btn-text{display:none} .L .logo span{display:none} .L .hdr .btn{padding:0 14px} }

/* Первый экран */
.L .hero-cover{position:relative;color:#fff;min-height:560px;display:flex;align-items:center;text-align:center}
.L .hero-cover .bg{position:absolute;inset:0}
.L .hero-cover .bg::after{content:"";position:absolute;inset:0;background:rgba(10,10,12,.52)}
.L .hero-cover .wrap{position:relative;padding-top:80px;padding-bottom:80px;width:100%}
.L .hero-cover h1{font-size:clamp(32px,5.2cqi,60px);font-weight:700;max-width:860px;margin:0 auto}
.L .hero-cover .s{font-size:clamp(17px,2.1cqi,22px);font-weight:300;margin-top:22px;opacity:.95}
.L .hero-cover .line{font-size:14px;margin-top:22px;opacity:.85}
.L .hero-cover .btns{justify-content:center;margin-top:40px}
.L .hero-split{padding:40px 0 64px}
.L .hero-grid{display:grid;gap:36px;align-items:center}
.L .hero-split h1,.L .hero-formv h1{font-size:clamp(30px,4.6cqi,52px);font-weight:700}
.L .hero-split .s,.L .hero-formv .s{font-size:clamp(17px,2cqi,21px);font-weight:300;color:var(--ink-2);margin-top:18px}
.L .hero-split .btns{margin-top:32px}
.L .hero-img{border-radius:24px;aspect-ratio:4/3}
.L .facts{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:10px;font-size:15px}
.L .facts li{display:flex;gap:10px;align-items:center}
.L .facts .ic{color:var(--red);width:20px;height:20px}
.L .hero-formv{background:var(--soft);padding:48px 0 64px}
@container L (min-width:760px){
  .L .hero-cover{min-height:700px}
  .L .hero-split{padding:64px 0 100px}
  .L .hero-grid{grid-template-columns:1.1fr .9fr;gap:64px}
  .L .hero-img{aspect-ratio:4/5}
  .L .hero-formv{padding:80px 0 100px}
}

/* Формы — прямоугольные поля, как на globalccm.com */
.L .form{background:#fff;color:var(--ink);padding:28px;display:grid;gap:14px;container-type:inline-size;container-name:F;border-radius:20px}
.L .sec.soft .form,.L .hero-formv .form{box-shadow:0 2px 24px rgba(17,19,23,.06)}
.L .form h3{font-size:22px;font-weight:700}
.L .form .fsub{color:var(--ink-2);font-size:14.5px;margin-top:-6px}
.L .inp{width:100%;min-height:50px;border-radius:0;border:1px solid #C9CDD3;background:#fff;padding:12px 16px;font:inherit;font-size:15px;color:var(--ink)}
.L .inp:focus{outline:none;border-color:var(--ink)}
.L select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8B9099 50%),linear-gradient(135deg,#8B9099 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.L .form .btn{justify-self:start;margin-top:6px}
.L .consent{font-size:12.5px;color:var(--muted)}
.L .frow{display:grid;gap:14px}
@container F (min-width:440px){ .L .frow.two{grid-template-columns:1fr 1fr} }
.L .ok{display:grid;place-items:center;text-align:center;gap:10px;padding:30px 10px}
.L .ok .ic{width:48px;height:48px;color:#1E9E5A}
.L .choice{display:grid;gap:10px}
.L .choice button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #C9CDD3;background:#fff;padding:14px 16px;cursor:pointer;font-weight:600}
.L .choice button:hover{border-color:var(--red);color:var(--red)}
.L .choice .ic{color:var(--red)}
.L .steps-dots{display:flex;gap:6px}
.L .steps-dots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.L .steps-dots i.on{background:var(--red)}

/* Доверие */
.L .nums{display:grid;gap:32px 20px;grid-template-columns:repeat(2,1fr);text-align:center}
.L .num b{display:block;font-size:clamp(34px,4.8cqi,52px);font-weight:700;line-height:1;color:var(--red)}
.L .num span{display:block;margin-top:10px;color:var(--ink-2);font-size:14.5px;max-width:220px;margin-left:auto;margin-right:auto}
@container L (min-width:760px){ .L .nums{grid-template-columns:repeat(4,1fr)} }
.L .strip{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;font-weight:600;font-size:14px}
.L .strip span{display:flex;gap:8px;align-items:flex-start}
.L .strip .ic{color:var(--red)}
@container L (min-width:760px){ .L .strip{display:flex;flex-wrap:wrap;gap:12px 40px;justify-content:center;font-size:15.5px} .L .strip span{align-items:center} }
.L .story{display:grid;gap:36px;align-items:center}
.L .story .ph{border-radius:20px;aspect-ratio:16/11}
.L .story p{color:var(--ink-2);margin-top:18px}
@container L (min-width:760px){ .L .story{grid-template-columns:1fr 1fr;gap:64px} }

/* Списки с галочками */
.L .checks{list-style:none;margin:0;padding:0;display:grid;gap:26px 40px}
.L .checks li{display:flex;gap:14px}
.L .checks .ic{color:var(--red);width:24px;height:24px;margin-top:2px}
.L .checks b{display:block;font-weight:700;font-size:16.5px}
.L .checks span{color:var(--ink-2);font-size:15px}
@container L (min-width:760px){ .L .checks.cols{grid-template-columns:repeat(2,1fr)} .L .checks.cols3{grid-template-columns:repeat(3,1fr)} }
.L .split{display:grid;gap:36px;align-items:center}
.L .split .ph{border-radius:20px;aspect-ratio:4/5}
@container L (min-width:760px){ .L .split{grid-template-columns:1fr 1fr;gap:64px} }

/* Таймлайн программы — как «Обучение первой помощи» на globalccm.com */
.L .prog{display:grid;gap:48px;align-items:start}
@container L (min-width:860px){ .L .prog.with-side{grid-template-columns:1.25fr .9fr;gap:64px} }
.L .tl{list-style:none;margin:0;padding:0;counter-reset:n}
.L .tl li{counter-increment:n;display:grid;grid-template-columns:30px 16px 1fr;gap:18px;align-items:start;position:relative;padding-bottom:24px;font-size:16.5px}
.L .tl li::before{content:counter(n);font-weight:700;font-size:18px;text-align:right;line-height:1.5}
.L .tl li .dot{width:16px;height:16px;border-radius:50%;background:var(--red);margin-top:5px}
.L .tl li:not(:last-child)::after{content:"";position:absolute;left:55.5px;top:24px;bottom:-4px;width:1px;background:#D5D8DD}
.L .side{display:grid;gap:18px}
.L .side h3{font-size:22px;font-weight:700;margin-bottom:4px}
.L .side .it{background:var(--soft);border-radius:20px;padding:24px}
.L .side .it b{display:block;font-size:17px;margin-bottom:6px}
.L .side .it p{color:var(--ink-2);font-size:15px}
.L .day{display:grid;gap:28px}
.L .day b{display:block;font-size:17px;margin:8px 0 4px}
.L .day span{color:var(--ink-2);font-size:15px}
.L .day i{font-style:normal;font-size:34px;font-weight:700;color:var(--red);line-height:1}
@container L (min-width:760px){ .L .day{grid-template-columns:repeat(4,1fr)} }
.L .topics{margin-top:48px;columns:1;column-gap:48px}
.L .topics li{margin-bottom:8px;color:var(--ink-2)}
@container L (min-width:760px){ .L .topics{columns:2} }

/* Список курсов — как «Мы проводим курсы» на globalccm.com */
.L .ctl{list-style:none;margin:0;padding:0}
.L .ctl li{display:grid;grid-template-columns:16px 1fr;grid-template-areas:"dot lbl" "dot body";column-gap:22px;position:relative;padding-bottom:48px}
.L .ctl .lbl{grid-area:lbl;color:var(--red);font-weight:700;font-size:22px;line-height:1.3}
.L .ctl .dot{grid-area:dot;width:16px;height:16px;border-radius:50%;background:var(--red);margin-top:7px}
.L .ctl .body{grid-area:body;margin-top:8px}
.L .ctl .body b{display:block;font-size:17.5px;font-weight:700}
.L .ctl .body p{color:var(--ink-2);margin-top:10px;font-weight:300;font-size:16.5px}
.L .ctl .body a{display:inline-block;margin-top:14px;color:var(--red);font-weight:700;cursor:pointer}
.L .ctl li:not(:last-child)::after{content:"";position:absolute;left:7.5px;top:26px;bottom:-4px;width:2px;background:var(--red)}
@container L (min-width:760px){
  .L .ctl li{grid-template-columns:240px 16px 1fr;grid-template-areas:"lbl dot body";column-gap:44px;padding-bottom:64px}
  .L .ctl .lbl{text-align:right;font-size:24px}
  .L .ctl .body{margin-top:0}
  .L .ctl li:not(:last-child)::after{left:291.5px}
}
.L .tbl-wrap{overflow-x:auto}
.L .tbl{width:100%;border-collapse:collapse;font-size:15.5px}

function opts(pid, blockId, override){
  const B = BLOCKS[blockId], P = PAGES[pid];
  const o = {};
  B.groups.forEach(g => {
    const saved = S.variants?.[pid]?.[blockId]?.[g.id];
    const valid = v => v && g.opts.some(x => x[0] === v);
    o[g.id] = (override && override[g.id]) || (valid(saved) ? saved : null) || P.def?.[blockId]?.[g.id] || g.opts[0][0];
  });
  return o;
}
const optKey = (blockId, o) => BLOCKS[blockId].groups.map(g => o[g.id]).join('/');
const optLabel = (blockId, o) => BLOCKS[blockId].groups.map(g => (g.opts.find(x => x[0] === o[g.id]) || [,''])[1]).join(' · ');
const countFor = (blockId, key) => COMMENTS.filter(c => c.block === blockId && (!key || c.variant === key)).length;

function bar(blockId, o, lib){
  const B = BLOCKS[blockId];
  const groups = B.groups.map(g => {
    if (lib && g.id === 'v') return '';
    return `<span class="grp">${B.groups.length > 1 || lib ? `<span>${g.label}:</span>` : ''}${g.opts.map(x => `<button class="T-pill ${o[g.id] === x[0] ? 'on' : ''}" onclick="setVar('${blockId}','${g.id}','${x[0]}')">${x[1]}</button>`).join('')}</span>`;
  }).join('');
  const key = optKey(blockId, o), n = countFor(blockId, key);
  const title = lib ? `${B.label} · ${(B.groups[0].opts.find(x => x[0] === o.v) || [,''])[1]}` : B.label;
  return `<div class="T-bar"><b>${title}</b>${groups}${B.note ? `<span class="T-note">${B.note}</span>` : ''}<button class="T-cbtn ${n ? 'has' : ''}" onclick='openComments(${JSON.stringify(blockId)}, ${JSON.stringify(o)})'>${ic('comment')}${n || ''} Комментарий</button></div>`;
}

function setVar(block, group, val){
  S.variants[S.page] = S.variants[S.page] || {};
  S.variants[S.page][block] = S.variants[S.page][block] || {};
  S.variants[S.page][block][group] = val;

}

   ============================================================ */
const BLOCKS_SRC = Object.values(BLOCKS).map(b => b.render.toString());
function collectQuestions(){
  const src = JSON.stringify([PAGES, BLOCKS_SRC, FAQ_COMMON, LINEUP]) + fieldsShort.toString();
  const map = new Map();
  src.replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g, (_, a, q) => {
    q = q.trim(); if (q === '?') return;
    if (!map.has(q)) map.set(q, a);
  });
  return [...map.entries()];
}

function openComments(block, o){ S.target = {block, o}; S.drawer = 'comments'; rerender(); setTimeout(() => document.getElementById('cmText')?.focus(), 50); }

  if (S.drawer === 'questions'){
    const qs = collectQuestions();
    d.innerHTML = tabs + `<div class="T-dbody"><p class="T-help">Всё, что в макете подсвечено жёлтым: факты, которые мы не знаем и не должны выдумывать. Список собирается автоматически из текстов.</p><ol class="T-qlist">${qs.map(([q,a]) => `<li>${esc(q)}${a ? `<small>В макете сейчас: «${esc(a)}»</small>` : ''}</li>`).join('')}</ol></div>
      <div class="T-dfoot"><button onclick="copyQuestions()">Скопировать списком</button></div>`;
    return;
  }
  const author = store.get(LS_AUTHOR, '');
  const tg = S.target;
  const key = tg ? optKey(tg.block, tg.o) : null;
  const list = COMMENTS.filter(c => !tg || (c.block === tg.block && c.variant === key)).sort((a,b) => b.ts - a.ts);
  const ctx = tg ? `<div class="T-ctx"><button class="x" onclick="S.target=null;rerender()">показать все</button><b>${BLOCKS[tg.block].label}</b><br>Вариант: ${optLabel(tg.block, tg.o)}</div>
      <input class="T-in" id="cmAuthor" placeholder="Ваше имя" value="${esc(author)}" style="margin-bottom:8px">
      <textarea class="T-in" id="cmText" placeholder="Что поменять, что нравится, какие вопросы"></textarea>
      <button class="T-add" onclick="addComment()">Добавить</button>`
    : `<p class="T-help">Чтобы оставить комментарий, нажмите «Комментарий» на панели нужного блока. Комментарии хранятся в этом браузере. Чтобы передать их, используйте «Экспорт», а полученный файл загрузите через «Импорт».</p>`;
  const items = list.length ? list.map(c => `<div class="T-cm"><div class="meta"><b>${esc(c.author || 'Без имени')}</b><span>${new Date(c.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>${!tg ? `<span class="tag">${esc(BLOCKS[c.block]?.label || c.block)} · ${esc(c.variantLabel || c.variant)}</span><span class="tag">${esc(PAGES[c.page]?.name || c.page)}</span>` : ''}<button class="del" onclick="delComment('${c.id}')">удалить</button></div><div class="txt">${esc(c.text)}</div></div>`).join('') : `<div class="T-empty">Комментариев пока нет</div>`;
  d.innerHTML = tabs + `<div class="T-dbody">${ctx}${items}</div>
    <div class="T-dfoot"><button onclick="exportComments()">Экспорт</button><button onclick="document.getElementById('importFile').click()">Импорт</button><button onclick="clearComments()">Очистить все</button></div>`;
}
function addComment(){
  const text = document.getElementById('cmText').value.trim(); if (!text) return;
  const author = document.getElementById('cmAuthor').value.trim(); store.set(LS_AUTHOR, author);
  const tg = S.target;
  COMMENTS.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), block: tg.block, variant: optKey(tg.block, tg.o), variantLabel: optLabel(tg.block, tg.o), page: S.page, author, text, ts: Date.now()});
  store.set(LS_COMM, COMMENTS); const y = window.scrollY; rerender(); window.scrollTo({top:y});
}
function delComment(id){ if (!confirm('Удалить комментарий?')) return; COMMENTS = COMMENTS.filter(c => c.id !== id); store.set(LS_COMM, COMMENTS); const y = window.scrollY; rerender(); window.scrollTo({top:y}); }
function clearComments(){ if (!confirm('Удалить все комментарии в этом браузере? Сначала сделайте экспорт, если они нужны.')) return; COMMENTS = []; store.set(LS_COMM, COMMENTS); rerender(); }
function exportComments(){
  const blob = new Blob([JSON.stringify({kind:'ccm-maket-comments', exported:new Date().toISOString(), comments:COMMENTS}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const who = (store.get(LS_AUTHOR,'') || 'comments').replace(/[^\p{L}\p{N}_-]+/gu,'_');
  a.download = `ccm-maket-${who}-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);
}
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    const data = JSON.parse(txt); const inc = Array.isArray(data) ? data : (data.comments || []);
    const ids = new Set(COMMENTS.map(c => c.id)); let n = 0;
    inc.forEach(c => { if (c && c.id && !ids.has(c.id)) { COMMENTS.push(c); n++; } });
    store.set(LS_COMM, COMMENTS); toast(`Добавлено комментариев: ${n}`); rerender();
  }).catch(() => toast('Не удалось прочитать файл'));
  e.target.value = '';
});
function copyQuestions(){
  const txt = collectQuestions().map(([q], i) => `${i+1}. ${q}`).join('\n');
  const done = () => toast('Список скопирован');
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done)); else fallbackCopy(txt, done);
}
function fallbackCopy(txt, cb){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); cb(); }catch(e){} ta.remove(); }
function toast(m){ const el = document.getElementById('toast'); el.textContent = m; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200); }

const tip = document.getElementById('tip');
function showTip(el){
  if (!S.marks) return;
  tip.innerHTML = `<b>Уточнить у ЦКМ:</b> ${esc(el.dataset.q)}`; tip.style.display = 'block';
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8), y = r.bottom + 8;
  if (y + h > window.innerHeight - 8) y = r.top - h - 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('mouseover', e => { const q = e.target.closest('.q'); if (q) showTip(q); });
document.addEventListener('mouseout', e => { if (e.target.closest('.q')) tip.style.display = 'none'; });
document.addEventListener('focusin', e => { const q = e.target.closest('.q'); if (q) showTip(q); });
document.addEventListener('focusout', () => tip.style.display = 'none');
document.addEventListener('click', e => {
  const a = e.target.closest('.L a[href^="#"]');
  if (a && a.getAttribute('href').length > 1){ const el = document.getElementById(a.getAttribute('href').slice(1)); if (el){ e.preventDefault(); el.scrollIntoView({behavior:'smooth'}); } }
});
window.addEventListener('scroll', () => tip.style.display = 'none', {passive:true});
window.addEventListener('resize', () => document.body.style.setProperty('--topbar-h', document.getElementById('top').offsetHeight + 'px'));

rerender();
</script>
</body>
</html>
